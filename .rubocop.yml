plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false

Style/Documentation:
  Enabled: false

Style/OpenStructUse:
  Exclude:
    - "spec/**/*"

Naming/FileName:
  Exclude:
    - "lib/omniauth-vitsme.rb"

Naming/VariableNumber:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"

Metrics/ModuleLength:
  Exclude:
    - "spec/**/*"

RSpec/ExampleLength:
  Max: 10

RSpec/MultipleExpectations:
  Max: 5

RSpec/NestedGroups:
  Max: 4

Metrics/ClassLength:
  Max: 150

Metrics/AbcSize:
  Max: 26

Metrics/CyclomaticComplexity:
  Max: 9

Metrics/PerceivedComplexity:
  Max: 9

Metrics/MethodLength:
  Max: 15
  Exclude:
    - "spec/**/*"

Metrics/ParameterLists:
  CountKeywordArgs: false

RSpec/SpecFilePathFormat:
  CustomTransform:
    OmniAuth: omniauth
